name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    name: Build on macOS
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer || true

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -c debug 2>&1

      - name: Build Release
        run: swift build -c release 2>&1
