name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer || true

      - name: Show architecture
        run: uname -m

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -c debug 2>&1

      - name: Build Release
        run: swift build -c release 2>&1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VibePomodoro-build
          path: |
            .build/release/*
            .build/debug/*
          if-no-files-found: warn
